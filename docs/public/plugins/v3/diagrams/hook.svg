<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" role="img" aria-label="同一次点播的三个观察点">
<title>同一次点播的三个观察点</title>
<rect width="900" height="180" rx="12" fill="#f6f9f8"/>
<g font-family="system-ui, sans-serif">
<g transform="translate(14 22)"><rect width="272" height="136" rx="12" fill="#fff" stroke="#b8d1c7"/><path d="M18 29h23" stroke="#237554" stroke-width="4"/><text x="18" y="59" font-size="21" font-weight="650" fill="#14392d">用户点播</text><text x="18" y="88" font-size="16" fill="#334d42">player.play</text><text x="18" y="113" font-size="15" fill="#486354">宿主准备执行</text></g>
<g transform="translate(314 22)"><rect width="272" height="136" rx="12" fill="#fff" stroke="#b8d1c7"/><path d="M18 29h23" stroke="#237554" stroke-width="4"/><text x="18" y="59" font-size="21" font-weight="650" fill="#14392d">规则判断</text><text x="18" y="88" font-size="16" fill="#334d42">preventDefault / next</text><text x="18" y="113" font-size="15" fill="#486354">取消本次，或继续下游</text></g>
<g transform="translate(614 22)"><rect width="272" height="136" rx="12" fill="#fff" stroke="#b8d1c7"/><path d="M18 29h23" stroke="#237554" stroke-width="4"/><text x="18" y="59" font-size="21" font-weight="650" fill="#14392d">查看结果</text><text x="18" y="88" font-size="16" fill="#334d42">player.play:done</text><text x="18" y="113" font-size="15" fill="#486354">读取 prevented、failed</text></g>
</g><path d="M289 89h19m-7-6 7 6-7 6m288-6h19m-7-6 7 6-7 6" fill="none" stroke="#257151" stroke-width="2"/></svg>
