<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
<title id="title">界面如何调用业务逻辑</title><desc id="desc">页面拥有自己的 DOM；后台持有 PluginContext；宿主决定哪些调用可执行。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#7c9aab"/></marker></defs>
<rect width="1200" height="790" rx="24" fill="#fff"/>
<g font-family="Microsoft YaHei, PingFang SC, system-ui, sans-serif">
<text x="38" y="55" font-size="17" fill="#139bb7" font-weight="650" text-anchor="start">CERU / PLUGIN V2</text>
<text x="38" y="101" font-size="34" fill="#142e40" font-weight="700" text-anchor="start">界面如何调用业务逻辑</text>
<text x="38" y="137" font-size="20" fill="#5b7282" font-weight="400" text-anchor="start">页面拥有自己的 DOM；后台持有 PluginContext；宿主决定哪些调用可执行。</text>
<rect x="36" y="190" width="338" height="70" rx="18" fill="#edf7fb" stroke="#139bb7" stroke-opacity=".25"/><rect x="36" y="210" width="5" height="30" rx="2" fill="#139bb7"/><text x="60" y="235" font-size="25" fill="#139bb7" font-weight="650" text-anchor="start">Surface · 页面</text><path d="M205 280 V600" stroke="#cee0e8" stroke-width="2" stroke-dasharray="6 8"/><rect x="430" y="190" width="338" height="70" rx="18" fill="#edf7fb" stroke="#139bb7" stroke-opacity=".25"/><rect x="430" y="210" width="5" height="30" rx="2" fill="#139bb7"/><text x="454" y="235" font-size="25" fill="#139bb7" font-weight="650" text-anchor="start">Action · 后台逻辑</text><path d="M599 280 V600" stroke="#cee0e8" stroke-width="2" stroke-dasharray="6 8"/><rect x="826" y="190" width="338" height="70" rx="18" fill="#edf7fb" stroke="#139bb7" stroke-opacity=".25"/><rect x="826" y="210" width="5" height="30" rx="2" fill="#139bb7"/><text x="850" y="235" font-size="25" fill="#139bb7" font-weight="650" text-anchor="start">Host · 服务</text><path d="M995 280 V600" stroke="#cee0e8" stroke-width="2" stroke-dasharray="6 8"/><path d="M205 321 L590 321" stroke="#7c9aab" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="245" y="304" font-size="19" fill="#23394b" font-weight="400" text-anchor="start">① invoke(action, input)</text><path d="M605 398 L980 398" stroke="#7c9aab" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="648" y="381" font-size="18" fill="#23394b" font-weight="400" text-anchor="start">② 授权后读写 storage / HTTP</text><path d="M981 470 L617 470" stroke="#7c9aab" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="660" y="452" font-size="20" fill="#23394b" font-weight="400" text-anchor="start">③ 服务结果或错误</text><path d="M586 549 L218 549" stroke="#7c9aab" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="252" y="531" font-size="20" fill="#23394b" font-weight="400" text-anchor="start">④ setState → subscribe</text><rect x="36" y="618" width="1128" height="112" rx="18" fill="#f0faf5" stroke="#168675" stroke-opacity=".25"/><rect x="36" y="638" width="5" height="30" rx="2" fill="#168675"/><text x="60" y="663" font-size="25" fill="#168675" font-weight="650" text-anchor="start">界面与业务各有边界</text><text x="60" y="699" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">页面只接收需要的状态；密码不回填；动作仍需校验输入与权限。</text>
<text x="38" y="766" font-size="16" fill="#6a8290" font-weight="400" text-anchor="start">澜音 ≥1.14.1 · 插件协议 v2 · Surface Action 契约 0.3.5</text>
</g></svg>
