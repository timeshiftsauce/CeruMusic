<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">私有存储与跨插件共享</title><desc id="desc">使用 Manifest 稳定 ID 解析目标；只有数据所属插件能决定谁可以读取。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#7c9aab"/></marker></defs>
<rect width="1200" height="760" rx="24" fill="#fff"/>
<g font-family="Microsoft YaHei, PingFang SC, system-ui, sans-serif">
<text x="38" y="55" font-size="17" fill="#139bb7" font-weight="650" text-anchor="start">CERU / PLUGIN V2</text>
<text x="38" y="101" font-size="34" fill="#142e40" font-weight="700" text-anchor="start">私有存储与跨插件共享</text>
<text x="38" y="137" font-size="20" fill="#5b7282" font-weight="400" text-anchor="start">使用 Manifest 稳定 ID 解析目标；只有数据所属插件能决定谁可以读取。</text>
<rect x="40" y="212" width="305" height="170" rx="18" fill="#f0fafd" stroke="#139bb7" stroke-opacity=".25"/><rect x="40" y="232" width="5" height="30" rx="2" fill="#139bb7"/><text x="64" y="257" font-size="25" fill="#139bb7" font-weight="650" text-anchor="start">插件 A · 数据所有者</text><text x="64" y="293" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">get / set / delete</text><text x="64" y="324" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">决定每个键的读取策略</text><text x="64" y="355" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">额度：完整记录 10 MiB</text><rect x="425" y="191" width="350" height="96" rx="18" fill="#f5f5fd" stroke="#526bc3" stroke-opacity=".25"/><rect x="425" y="211" width="5" height="30" rx="2" fill="#526bc3"/><text x="449" y="236" font-size="25" fill="#526bc3" font-weight="650" text-anchor="start">私有键</text><text x="449" y="260" font-size="20" fill="#23394b" font-weight="400" text-anchor="start">新键默认私有 · [] 撤回共享</text><rect x="425" y="316" width="350" height="96" rx="18" fill="#f0faf5" stroke="#168675" stroke-opacity=".25"/><rect x="425" y="336" width="5" height="30" rx="2" fill="#168675"/><text x="449" y="361" font-size="25" fill="#168675" font-weight="650" text-anchor="start">指定读取者</text><text x="449" y="385" font-size="20" fill="#23394b" font-weight="400" text-anchor="start">readableBy: [&#x27;example.b&#x27;]</text><rect x="425" y="441" width="350" height="96" rx="18" fill="#f0fafd" stroke="#139bb7" stroke-opacity=".25"/><rect x="425" y="461" width="5" height="30" rx="2" fill="#139bb7"/><text x="449" y="486" font-size="25" fill="#139bb7" font-weight="650" text-anchor="start">公开读取</text><text x="449" y="510" font-size="20" fill="#23394b" font-weight="400" text-anchor="start">readableBy: &#x27;*&#x27;</text><rect x="850" y="320" width="310" height="170" rx="18" fill="#f0fafd" stroke="#139bb7" stroke-opacity=".25"/><rect x="850" y="340" width="5" height="30" rx="2" fill="#139bb7"/><text x="874" y="365" font-size="25" fill="#139bb7" font-weight="650" text-anchor="start">插件 B · 读取者</text><text x="874" y="401" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">get({ pluginId, key })</text><text x="874" y="432" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">不能修改 A 的数据</text><text x="874" y="463" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">读取不复制占用 B 的额度</text><path d="M345 285 L410 285" stroke="#7c9aab" stroke-width="3" fill="none"/><path d="M386 239 L386 488" stroke="#7c9aab" stroke-width="3" fill="none"/><path d="M386 239 L414 239" stroke="#7c9aab" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M386 364 L414 364" stroke="#7c9aab" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M386 489 L414 489" stroke="#7c9aab" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M775 364 L838 364" stroke="#7c9aab" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M775 489 L838 460" stroke="#7c9aab" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="849" y="247" font-size="19" fill="#526bc3" font-weight="400" text-anchor="start">私有键拒绝跨插件读取</text><rect x="40" y="588" width="1120" height="113" rx="18" fill="#f0faf5" stroke="#168675" stroke-opacity=".25"/><rect x="40" y="608" width="5" height="30" rx="2" fill="#168675"/><text x="64" y="633" font-size="25" fill="#168675" font-weight="650" text-anchor="start">共享权限是访问控制，不是加密</text><text x="64" y="669" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">额度按 UTF-8 JSON 字节计量，包含数据与权限。已被读取的副本无法通过撤权收回。</text>
<text x="38" y="736" font-size="16" fill="#6a8290" font-weight="400" text-anchor="start">澜音 ≥1.14.1 · 插件协议 v2 · Storage 类型来自 SDK 0.3.5</text>
</g></svg>
