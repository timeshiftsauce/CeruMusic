<text x="38" y="101" font-size="34" fill="#142e40" font-weight="700" text-anchor="start">插件与宿主如何分工</text>
<text x="38" y="137" font-size="20" fill="#5b7282" font-weight="400" text-anchor="start">SDK 定义契约；CLI 负责构建；Core 管协议；Host 提供实际能力。</text>
<rect x="40" y="200" width="300" height="194" rx="18" fill="#f0fafd" stroke="#139bb7" stroke-opacity=".25"/><rect x="40" y="220" width="5" height="30" rx="2" fill="#139bb7"/><text x="64" y="245" font-size="25" fill="#139bb7" font-weight="650" text-anchor="start">作者工程</text><text x="64" y="281" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">Manifest 与逻辑代码</text><text x="64" y="312" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">可选页面、样式、资源</text><text x="64" y="343" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">SDK 提供类型与辅助函数</text><rect x="420" y="200" width="350" height="194" rx="18" fill="#f0fafd" stroke="#139bb7" stroke-opacity=".25"/><rect x="420" y="220" width="5" height="30" rx="2" fill="#139bb7"/><text x="444" y="245" font-size="25" fill="#139bb7" font-weight="650" text-anchor="start">CLI → 单文件</text><text x="444" y="281" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">编译 TS / Vue / React</text><text x="444" y="312" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">嵌入资源和页面运行代码</text><text x="444" y="343" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">输出 plugin.js</text><path d="M349 296 L410 296" stroke="#7c9aab" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="850" y="200" width="310" height="194" rx="18" fill="#f0fafd" stroke="#139bb7" stroke-opacity=".25"/><rect x="850" y="220" width="5" height="30" rx="2" fill="#139bb7"/><text x="874" y="245" font-size="25" fill="#139bb7" font-weight="650" text-anchor="start">Core</text><text x="874" y="281" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">静态读取与校验</text><text x="874" y="312" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">注册 Provider / Action</text><text x="874" y="343" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">校验标准数据</text><path d="M779 296 L840 296" stroke="#7c9aab" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="420" y="468" width="350" height="144" rx="18" fill="#f0fafd" stroke="#139bb7" stroke-opacity=".25"/><rect x="420" y="488" width="5" height="30" rx="2" fill="#139bb7"/><text x="444" y="513" font-size="25" fill="#139bb7" font-weight="650" text-anchor="start">后台逻辑</text><text x="444" y="549" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">隔离 Worker</text><text x="444" y="580" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">网络、存储通过 Host</text><rect x="850" y="468" width="310" height="144" rx="18" fill="#f0fafd" stroke="#139bb7" stroke-opacity=".25"/><rect x="850" y="488" width="5" height="30" rx="2" fill="#139bb7"/><text x="874" y="513" font-size="25" fill="#139bb7" font-weight="650" text-anchor="start">可见界面</text><text x="874" y="549" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">Web 隔离窗口 / 原生抽屉</text><text x="874" y="580" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">通过 Action / State 通信</text><path d="M1005 402 L1005 456" stroke="#7c9aab" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1005 430 L595 430" stroke="#7c9aab" stroke-width="3" fill="none"/><path d="M595 430 L595 456" stroke="#7c9aab" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="468" width="300" height="144" rx="18" fill="#f0faf5" stroke="#168675" stroke-opacity=".25"/><rect x="40" y="488" width="5" height="30" rx="2" fill="#168675"/><text x="64" y="513" font-size="25" fill="#168675" font-weight="650" text-anchor="start">澜音 Host</text><text x="64" y="549" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">授权、安装与生命周期</text><text x="64" y="580" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">接入已有音乐业务</text>
