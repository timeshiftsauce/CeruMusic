ight="139" rx="18" fill="#f0fafd" stroke="#139bb7" stroke-opacity=".25"/><rect x="800" y="197" width="5" height="30" rx="2" fill="#139bb7"/><text x="824" y="222" font-size="25" fill="#139bb7" font-weight="650" text-anchor="start">04  宿主边界</text><text x="824" y="258" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">Manifest 声明 → 用户授权</text><text x="824" y="289" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">检查实际接入状态</text><path d="M740 410 C770 410 750 421 800 421" fill="none" stroke="#168675" stroke-opacity=".45" stroke-width="3"/><rect x="800" y="352" width="360" height="139" rx="18" fill="#f0fafd" stroke="#168675" stroke-opacity=".25"/><rect x="800" y="372" width="5" height="30" rx="2" fill="#168675"/><text x="824" y="397" font-size="25" fill="#168675" font-weight="650" text-anchor="start">05  数据与配置</text><text x="824" y="433" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">配置默认值 / 持久化存储</text><text x="824" y="464" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">10 MiB · 私有与共享读取</text><path d="M740 410 C770 410 750 596 800 596" fill="none" stroke="#526bc3" stroke-opacity=".45" stroke-width="3"/><rect x="800" y="527" width="360" height="139" rx="18" fill="#f0fafd" stroke="#526bc3" stroke-opacity=".25"/><rect x="800" y="547" width="5" height="30" rx="2" fill="#526bc3"/><text x="824" y="572" font-size="25" fill="#526bc3" font-weight="650" text-anchor="start">06  交付维护</text><text x="824" y="608" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">构建 → 校验 → 安装 → 发布</text><text x="824" y="639" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">签名 · 迁移 · 故障排查</text><rect x="460" y="340" width="280" height="140" rx="28" fill="#143e55"/><text x="600" y="395" font-size="31" fill="white" font-weight="700" text-anchor="middle">澜音插件 v2</text><text x="600" y="440" font-size="22" fill="#b5e7ee" font-weight="400" text-anchor="middle">一个 JS · 一组能力</text>
