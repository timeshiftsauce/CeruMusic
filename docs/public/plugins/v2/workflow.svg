<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">从第一行代码到可安装插件</title><desc id="desc">每一步都有可检查的结果；开发环境通过后，继续验证实际交付文件。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#7c9aab"/></marker></defs>
<rect width="1200" height="610" rx="24" fill="#fff"/>
<g font-family="Microsoft YaHei, PingFang SC, system-ui, sans-serif">
<text x="38" y="55" font-size="17" fill="#139bb7" font-weight="650" text-anchor="start">CERU / PLUGIN V2</text>
<text x="38" y="101" font-size="34" fill="#142e40" font-weight="700" text-anchor="start">从第一行代码到可安装插件</text>
<text x="38" y="137" font-size="20" fill="#5b7282" font-weight="400" text-anchor="start">每一步都有可检查的结果；开发环境通过后，继续验证实际交付文件。</text>
<rect x="30" y="204" width="205" height="170" rx="18" fill="#f0fafd" stroke="#139bb7" stroke-opacity=".25"/><rect x="30" y="224" width="5" height="30" rx="2" fill="#139bb7"/><text x="54" y="249" font-size="25" fill="#139bb7" font-weight="650" text-anchor="start">01 创建工程</text><text x="54" y="285" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">选择模板和语言</text><text x="54" y="316" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">npm create</text><path d="M238 284 L261 284" stroke="#7c9aab" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="265" y="204" width="205" height="170" rx="18" fill="#f0fafd" stroke="#139bb7" stroke-opacity=".25"/><rect x="265" y="224" width="5" height="30" rx="2" fill="#139bb7"/><text x="289" y="249" font-size="25" fill="#139bb7" font-weight="650" text-anchor="start">02 开发调试</text><text x="289" y="285" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">类型检查与重载</text><text x="289" y="316" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">npm run dev</text><path d="M473 284 L496 284" stroke="#7c9aab" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="500" y="204" width="205" height="170" rx="18" fill="#f0fafd" stroke="#139bb7" stroke-opacity=".25"/><rect x="500" y="224" width="5" height="30" rx="2" fill="#139bb7"/><text x="524" y="249" font-size="25" fill="#139bb7" font-weight="650" text-anchor="start">03 构建校验</text><text x="524" y="285" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">生成单个 JS</text><text x="524" y="316" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">build + validate</text><path d="M708 284 L731 284" stroke="#7c9aab" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="735" y="204" width="205" height="170" rx="18" fill="#f0fafd" stroke="#139bb7" stroke-opacity=".25"/><rect x="735" y="224" width="5" height="30" rx="2" fill="#139bb7"/><text x="759" y="249" font-size="25" fill="#139bb7" font-weight="650" text-anchor="start">04 成品验证</text><text x="759" y="285" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">预览 + 桌面安装</text><text x="759" y="316" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">检查权限与数据</text><path d="M943 284 L966 284" stroke="#7c9aab" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="970" y="204" width="205" height="170" rx="18" fill="#f0fafd" stroke="#139bb7" stroke-opacity=".25"/><rect x="970" y="224" width="5" height="30" rx="2" fill="#139bb7"/><text x="994" y="249" font-size="25" fill="#139bb7" font-weight="650" text-anchor="start">05 发布维护</text><text x="994" y="285" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">版本 / 许可 / 说明</text><text x="994" y="316" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">更新与迁移</text><rect x="30" y="425" width="1140" height="116" rx="18" fill="#f0faf5" stroke="#168675" stroke-opacity=".25"/><rect x="30" y="445" width="5" height="30" rx="2" fill="#168675"/><text x="54" y="470" font-size="25" fill="#168675" font-weight="650" text-anchor="start">交付给用户：dist/plugin.js</text><text x="54" y="506" font-size="21" fill="#23394b" font-weight="400" text-anchor="start">用户不需要源码、node_modules、TypeScript 编译器或开发服务器。</text>
<text x="38" y="586" font-size="16" fill="#6a8290" font-weight="400" text-anchor="start">澜音 ≥1.14.1 · 插件协议 v2 · 工具链 0.3.5</text>
</g></svg>
