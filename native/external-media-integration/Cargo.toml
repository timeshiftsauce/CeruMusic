[package]
name = "external-media-integration"
version = "0.1.0"
edition = "2021"
description = "CeruMusic 原生外部媒体集成：系统媒体控件 (SMTC / MPRIS / NowPlayingInfoCenter)"
license = "AGPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi4", "async", "serde-json"] }
napi-derive = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Media_Playback",
    "Storage_Streams",
    "Win32_System_Com",
] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
# Foundation/AppKit/MediaPlayer 的绑定是按 symbol 分 feature 开关的，
# 必须显式列出用到的符号，否则默认只导出基本的 NSObject，编译会报
# "no `NSData` in the root" / "gated behind the `NSGeometry` feature"。
objc2-foundation = { version = "0.2", features = [
    "NSData",
    "NSDictionary",
    "NSGeometry",
    "NSString",
    "NSValue",
] }
objc2-app-kit = { version = "0.2", features = ["NSImage"] }
objc2-media-player = { version = "0.2", features = [
    "MPMediaItem",
    "MPNowPlayingInfoCenter",
    "MPRemoteCommand",
    "MPRemoteCommandCenter",
    "MPRemoteControlTypes",
] }
block2 = "0.5"
tokio = { version = "1", features = ["rt-multi-thread"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = true
