name: Upload Signed macOS Builds To Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '目标 Release tag（留空 = 最新 Release）'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: mac-release-assets

jobs:
  release:
    name: Resolve target release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="$INPUT_TAG"
          if [ -z "$tag" ]; then
            tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.+-]+)?$ ]]; then
            echo 'Invalid release tag' >&2
            exit 1
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    name: Build signed macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            arch: x64
          - os: macos-latest
            arch: arm64
    defaults:
      run:
        working-directory: release-source
    steps:
      - name: Check out signing workflow
        uses: actions/checkout@v5
        with:
          path: release-workflow
      - name: Check out the released sources
        uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
          path: release-source
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: release-source/yarn.lock
      - name: Verify source version
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          test "v$(node -p "require('./package.json').version")" = "$RELEASE_TAG"
          git rev-parse HEAD
      - name: Install dependencies
        shell: bash
        run: |
          npm i -g yarn@1.22.22
          yarn run setup
      - name: Verify Electron runtime and native modules
        run: node scripts/check-native-runtime.cjs
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build native external-media-integration module
        run: yarn run build:native:emi
      - name: Build, sign and notarize Electron App for macOS
        shell: bash
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash ../release-workflow/scripts/build-macos-release.sh
      - name: Verify packaged native modules
        run: node scripts/check-native-runtime.cjs --packaged
      - name: Stage signed macOS artifacts
        uses: actions/upload-artifact@v6
        with:
          name: signed-mac-${{ matrix.arch }}
          path: |
            release-source/dist/*.dmg
            release-source/dist/*.zip
            release-source/dist/*.blockmap
            release-source/dist/latest-mac-${{ matrix.arch }}.yml
          if-no-files-found: error

  publish:
    name: Replace macOS release assets
    runs-on: ubuntu-latest
    needs: [release, build]
    permissions:
      contents: write
    steps:
      - name: Download verified macOS artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: signed-mac-*
          path: dist
          merge-multiple: true
      - name: Verify files and update the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          packages=()
          metadata=()
          for arch in x64 arm64; do
            prefix="dist/ceru-music-$version-$arch"
            packages+=("$prefix.dmg" "$prefix.dmg.blockmap" "$prefix-mac.zip" "$prefix-mac.zip.blockmap")
            info="dist/latest-mac-$arch.yml"
            grep -Fx "version: $version" "$info"
            grep -F "path: ceru-music-$version-$arch-mac.zip" "$info"
            metadata+=("$info")
          done
          for file in "${packages[@]}" "${metadata[@]}"; do test -s "$file"; done
          gh release upload "$RELEASE_TAG" "${packages[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE_TAG" "${metadata[@]}" --clobber --repo "$GITHUB_REPOSITORY"
